name: Telegram Bio Clock 24/7

on:
  push:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bio-clock
  cancel-in-progress: true

jobs:
  run-bio-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram Bio Clock (5 hours)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || vars.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || vars.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING || vars.TELEGRAM_SESSION_STRING }}
          BIO_TEMPLATE: ${{ vars.BIO_TEMPLATE }}
          TIMEZONE: "Asia/Tashkent"
          RUN_DURATION_SECONDS: "18000"
        run: python bio_clock.py
